# Ascend NPU BF16 inference template.
# Launch with:
#   LLV2_DEVICE=npu python inference.py --config_path configs/inference_npu_bf16.yaml
# or distributed:
#   LLV2_DEVICE=npu torchrun --standalone --nproc_per_node=4 inference.py --config_path configs/inference_npu_bf16.yaml

model_kwargs:
  model_name: Wan2.2-TI2V-5B
  timestep_shift: 5.0
  num_frame_per_block: 8
  local_attn_size: 32

use_ema: false
output_folder: videos/longlive2_npu_bf16
num_samples: 1
save_latents_only: false
save_with_index: true
inference_iter: -1

data:
  data_path: /path/to/longlive2/inference_prompts
  image_or_video_shape:
  - 1
  - 128
  - 48
  - 44
  - 80

inference:
  sampling_steps: 4
  sink_size: 8
  guidance_scale: 1.0
  multi_shot_sink: true
  multi_shot_rope_offset: 8
  kv_quant: false
  streaming_vae: false
  async_vae: false
  vae_type: wan
  vae_device: null

checkpoints:
  generator_ckpt: /path/to/longlive2/generator_checkpoint.pt
  lora_ckpt: null

model_quant: false
torch_compile: false

# Remove this section if the generator checkpoint is already merged.
adapter:
  type: lora
  rank: 128
  alpha: 128
  dropout: 0.0
  dtype: bfloat16
  verbose: true

logging:
  seed: 0
