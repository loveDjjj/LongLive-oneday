# 昇腾 NPU BF16 推理配置模板。
# 启动方式：
#   LLV2_DEVICE=npu python inference.py --config_path configs/inference_npu_bf16.yaml
# 多卡：
#   LLV2_DEVICE=npu torchrun --standalone --nproc_per_node=4 inference.py --config_path configs/inference_npu_bf16.yaml

model_kwargs:
  model_name: Wan2.2-TI2V-5B
  model_root: /mnt/share/weight/Wan2.2-TI2V-5B
  timestep_shift: 5.0
  num_frame_per_block: 8
  local_attn_size: 32

use_ema: false
output_folder: videos/longlive2_npu_bf16
num_samples: 1
save_latents_only: false
save_with_index: true
inference_iter: -1

data:
  data_path: example/long_example.txt
  image_or_video_shape:
  - 1
  - 128
  - 48
  - 44
  - 80

inference:
  sampling_steps: 4
  sink_size: 8
  guidance_scale: 1.0
  multi_shot_sink: true
  multi_shot_rope_offset: 8
  kv_quant: false
  streaming_vae: false
  async_vae: false
  vae_type: wan
  vae_device: null

checkpoints:
  generator_ckpt: /mnt/share/weight/LongLive/checkpoints/longlive_5b/generator.pt
  lora_ckpt: /mnt/share/weight/LongLive/checkpoints/longlive_5b/lora.pt

model_quant: false
torch_compile: false

# 如果 generator_ckpt 已经是合并后的完整权重，可以删除 adapter 段。
adapter:
  type: lora
  rank: 128
  alpha: 128
  dropout: 0.0
  dtype: bfloat16
  verbose: true

logging:
  seed: 0
