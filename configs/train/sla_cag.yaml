# LongLive2.0-5B 在昇腾上的 SLA+CAG 稀疏后训练配置。
# 当前训练只读取提示词，不读取真实视频；生成器使用稀疏注意力，教师和判别器保持稠密注意力。

infra:
  # SP 组内多卡共同计算一个视频样本；有效数据并行数为 world_size / sequence_parallel_size。
  # 16 卡正式训练使用 SP8 x DP2；每个 SP rank 处理 3 个 attention head。
  sequence_parallel_size: 8
  sharding_strategy: hybrid_full
  mixed_precision: true
  gradient_checkpointing: true
  generator_fsdp_wrap_strategy: size
  real_score_fsdp_wrap_strategy: size
  fake_score_fsdp_wrap_strategy: size
  text_encoder_fsdp_wrap_strategy: size

model_kwargs:
  model_name: Wan2.2-TI2V-5B
  model_root: /mnt/share/weight/Wan2.2-TI2V-5B
  timestep_shift: 5.0
  # 每个时间块包含 8 个 latent frame，32 帧训练轨迹共分为 4 个块。
  num_frame_per_block: 8
  local_attn_size: 32
  sparse_config:
    enabled: true
    method: sla_cag
    backend: ascend_triton
    # 与 HSA+SLA+CAG 使用相同预算，保证路由方法对比不混入稀疏率差异。
    # sparsity 是全程目标平均稀疏率；sparsity_base 是 CAG 尾部调度基准。
    sparsity: 0.90
    sparsity_base: 0.93
    # Ulysses 交换后每个 8 帧 chunk 有 7040 token，可被 128-token block 整除。
    block_q: 128
    block_k: 128
    feature_map: softmax
    keep_sink_frames: 1
    keep_recent_frames: 1
    dense_current: false
    min_sparse_history_frames: 1
    linear_cache: true
    linear_eps: 1.0e-5
    # portable 后端按该值合并 Query Block；Triton 后端直接消费完整 LUT。
    query_block_batch: 1
    num_output_frames: 32
    num_frame_per_block: 8
    local_attn_size: 32

# DMD 的真实分数教师保持稠密注意力且不更新参数。
real_model_kwargs:
  model_name: Wan2.2-TI2V-5B
  model_root: /mnt/share/weight/Wan2.2-TI2V-5B
  timestep_shift: 5.0
  num_frame_per_block: 8
  local_attn_size: 32

# Fake Score 判别器保持稠密注意力，通过 LoRA 学习当前生成分布。
fake_model_kwargs:
  model_name: Wan2.2-TI2V-5B
  model_root: /mnt/share/weight/Wan2.2-TI2V-5B
  timestep_shift: 5.0
  num_frame_per_block: 8
  local_attn_size: 32

checkpoints:
  # 基础生成器权重；恢复训练时优先读取运行目录中最新的 train_state.pt。
  generator_ckpt: /mnt/share/weight/LongLive/checkpoints/longlive2_5b/longlive2_merged_generator.pt
  lora_ckpt: null

algorithm:
  trainer: score_distillation
  distribution_loss: dmd
  all_causal: true
  generator_is_causal: true
  # 当前维护的是纯提示词 on-policy backward simulation，不支持视频监督和 I2V。
  i2v: false
  backward_simulation: true
  teacher_forcing: false
  independent_first_frame: false
  denoising_loss_type: flow
  num_train_timestep: 1000
  real_guidance_scale: 3.0
  fake_guidance_scale: 0.0

training:
  generator_train_scope: lora
  lr: 2.0e-06
  lr_critic: 4.0e-07
  weight_decay: 0.0
  beta1: 0.0
  beta2: 0.999
  beta1_critic: 0.0
  beta2_critic: 0.999
  # 每个 DP 副本一次处理一个提示词；SP rank 不计入 batch。
  batch_size: 1
  # 有效 batch = DP 数量 x batch_size x gradient_accumulation_steps。
  gradient_accumulation_steps: 4
  max_grad_norm_generator: 10.0
  max_grad_norm_critic: 10.0
  # LoRA 模式不维护 EMA。
  ema_weight: 0.0
  # 每 20 次 optimizer update 保存一次，只保留最近 5 个完整 checkpoint。
  log_iters: 20
  max_checkpoints: 5
  max_iters: 1000
  gc_interval: 50
  # 与混合主方案对齐：Generator 与 Critic 每个 optimizer step 都更新。
  dfake_gen_update_ratio: 1
  num_training_frames: 32
  slice_last_frames: 32

data:
  # UTF-8 文本，每个非空行是一个训练提示词。
  data_path: data/train/vidprom_filtered_extended/prompts_train.txt
  eval_data_path: data/benchmarks/vbench_standard/5pct/prompts.txt
  # 顺序为 [batch, latent帧, channel, height, width]。
  image_or_video_shape: [1, 32, 48, 44, 80]

inference:
  # backward simulation 和训练内验证使用相同的 4 步采样设置。
  sampling_steps: 4
  local_attn_size: 32
  sink_size: 0
  multi_shot_sink: false
  multi_shot_rope_offset: 8

evaluation:
  # 所有 rank 必须共同进入 FSDP 验证；默认只保存 latent，避免训练中频繁 VAE 解码。
  interval: 100
  num_frames: 32
  use_ema: false
  val_batch_size: 1
  save_latents_only: true

adapter:
  type: lora
  rank: 128
  alpha: 128
  dropout: 0.0
  apply_to_critic: true
  verbose: true

# 昇腾 BF16 正式路径不启用量化。
model_quant: false

logging:
  seed: 42
  wandb_key: null
  wandb_entity: null
  wandb_project: LongLive2-SLA-CAG-NPU
