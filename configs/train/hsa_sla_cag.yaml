# LongLive2.0-5B frame-filtered SLA+CAG linear-only fine-tuning on Ascend NPU.
infra:
  sequence_parallel_size: 4
  sharding_strategy: hybrid_full
  mixed_precision: true
  gradient_checkpointing: true
  generator_fsdp_wrap_strategy: size
  real_score_fsdp_wrap_strategy: size
  fake_score_fsdp_wrap_strategy: size
  text_encoder_fsdp_wrap_strategy: size

model_kwargs:
  model_name: Wan2.2-TI2V-5B
  model_root: /mnt/share/weight/Wan2.2-TI2V-5B
  timestep_shift: 5.0
  num_frame_per_block: 8
  local_attn_size: 32
  sparse_config:
    enabled: true
    method: hsa_sla_cag
    backend: ascend_triton
    sparsity: 0.90
    sparsity_base: 0.93
    block_q: 128
    block_k: 128
    feature_map: softmax
    candidate_frames: 8
    keep_sink_frames: 1
    keep_recent_frames: 1
    dense_current: false
    min_sparse_history_frames: 2
    query_block_batch: 1
    linear_cache: true
    linear_eps: 1.0e-5
    num_output_frames: 32
    num_frame_per_block: 8
    local_attn_size: 32

real_model_kwargs:
  model_name: Wan2.2-TI2V-5B
  model_root: /mnt/share/weight/Wan2.2-TI2V-5B
  timestep_shift: 5.0
  num_frame_per_block: 8
  local_attn_size: 32

fake_model_kwargs:
  model_name: Wan2.2-TI2V-5B
  model_root: /mnt/share/weight/Wan2.2-TI2V-5B
  timestep_shift: 5.0
  num_frame_per_block: 8
  local_attn_size: 32

checkpoints:
  generator_ckpt: /mnt/share/weight/LongLive/checkpoints/longlive2_5b/longlive2_merged_generator.pt
  lora_ckpt: null

algorithm:
  trainer: score_distillation
  distribution_loss: dmd
  all_causal: true
  generator_is_causal: true
  i2v: false
  backward_simulation: true
  teacher_forcing: false
  independent_first_frame: false
  denoising_loss_type: flow
  num_train_timestep: 1000
  real_guidance_scale: 3.0
  fake_guidance_scale: 0.0

training:
  generator_train_scope: linear_only
  lr: 2.0e-05
  lr_critic: 4.0e-07
  weight_decay: 0.0
  beta1: 0.0
  beta2: 0.999
  beta1_critic: 0.0
  beta2_critic: 0.999
  batch_size: 1
  gradient_accumulation_steps: 16
  max_grad_norm_generator: 10.0
  max_grad_norm_critic: 10.0
  ema_weight: 0.0
  log_iters: 10
  max_checkpoints: 20
  max_iters: 1000
  gc_interval: 50
  dfake_gen_update_ratio: 1
  num_training_frames: 32
  slice_last_frames: 32

data:
  data_path: data/train/vidprom_filtered_extended/prompts_train.txt
  eval_data_path: data/benchmarks/vbench_standard/5pct/prompts.txt
  image_or_video_shape: [1, 32, 48, 44, 80]

inference:
  sampling_steps: 4
  local_attn_size: 32
  sink_size: 0
  multi_shot_sink: false
  multi_shot_rope_offset: 8

evaluation:
  interval: 100
  num_frames: 32
  use_ema: false
  val_batch_size: 1
  save_latents_only: true

adapter:
  type: lora
  rank: 128
  alpha: 128
  dropout: 0.0
  apply_to_critic: true
  verbose: true

model_quant: false

logging:
  seed: 42
  wandb_key: null
  wandb_entity: null
  wandb_project: LongLive2-HSA-SLA-CAG-NPU
