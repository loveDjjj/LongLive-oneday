# LongLive2.0-5B 在昇腾上的 HSA+SLA+CAG 主训练配置。
# Generator 主干使用 LoRA，同时直接训练 30 层 sla_linear；Fake Critic 使用 LoRA。
# 此处保留 NPU 默认。LLV2_DEVICE=cuda 时启动器解析为4卡SP4、累积8、portable后端与BF16底座加载；可训练参数保留FP32。
infra:
  # SP 组共同计算一个视频；DP 数为 world_size / sequence_parallel_size。
  # 16 卡正式训练使用 SP8 x DP2；每个 SP rank 处理 3 个 attention head。
  sequence_parallel_size: 8
  # 三个 5B 网络使用 FSDP hybrid full 分片，BF16 计算并开启激活重计算。
  sharding_strategy: hybrid_full
  mixed_precision: true
  gradient_checkpointing: true
  generator_fsdp_wrap_strategy: size
  real_score_fsdp_wrap_strategy: size
  fake_score_fsdp_wrap_strategy: size
  text_encoder_fsdp_wrap_strategy: size

model_kwargs:
  # 模型路径可由启动脚本的 MODEL_ROOT 覆盖。
  model_name: Wan2.2-TI2V-5B
  model_root: /mnt/share/r50063443/Wan2.2-TI2V-5B
  timestep_shift: 5.0
  num_frame_per_block: 8
  # LongLive2.0 滚动 KV 最多保留 32 个 latent 帧。
  local_attn_size: 32
  sparse_config:
    enabled: true
    method: hsa_sla_cag
    backend: ascend_triton
    # 三种方法统一使用 85% 目标平均稀疏率与 95% CAG 尾部调度基准。
    sparsity: 0.85
    sparsity_base: 0.95
    # RainFusion 使用 128-token block；训练 kernel 内部拆为较小 tile。
    block_q: 128
    block_k: 128
    feature_map: softmax
    # 与 HSA+CAG 调用同一个 history-only frame router；当前 8 帧不参与 history quota。
    protect_current_frames: true
    # 直接复用 LongLive KV manager 的 global/shot sink metadata。
    protect_longlive_sink_frames: true
    # frame-stage 固定保留最近 4 个非 protected history frame。
    keep_near_history_frames: 4
    # frame-stage 从剩余 history 中按 HSA frame score 动态选择最多 4 帧。
    keep_dynamic_history_frames: 4
    # 当前 blocks 与候选 history blocks 共同参加 Smooth-K 全局 Top-K。
    dense_current_blocks: false
    # 只保留 global sink / shot sink 各前 2 帧进入候选池，避免把整个 sink chunk 都当作固定先验。
    max_global_sink_frames: 2
    max_shot_sink_frames: 2
    # 首个 AR chunk 没有 history，必须执行 dense attention。
    first_chunk_dense: true
    # 前缀 dense 的 AR chunk 数，按整段训练 rollout chunk 编号计算；multi-shot 边界不自动重置。
    dense_prefix_chunks: 1
    # 最终 K 以完整 resident KV blocks 为分母，HSA 只限制 eligible candidate pool。
    budget_reference: full_resident_kv
    # 线性补偿分支始终读取完整 resident KV 统计量，不受 frame/block router 限制。
    full_kv_linear_compensation: true
    query_block_batch: 1
    # 线性补偿使用完整 KV，推理时缓存历史统计量；路由 softmax 只读选中 blocks。
    linear_cache: true
    linear_eps: 1.0e-5
    num_output_frames: 32
    num_frame_per_block: 8
    local_attn_size: 32

real_model_kwargs:
  model_name: Wan2.2-TI2V-5B
  model_root: /mnt/share/r50063443/Wan2.2-TI2V-5B
  timestep_shift: 5.0
  num_frame_per_block: 8
  local_attn_size: 32

fake_model_kwargs:
  model_name: Wan2.2-TI2V-5B
  model_root: /mnt/share/r50063443/Wan2.2-TI2V-5B
  timestep_shift: 5.0
  num_frame_per_block: 8
  local_attn_size: 32

checkpoints:
  # LongLive2.0 合并 Generator；恢复时优先使用 run 目录最新 train_state.pt。
  generator_ckpt: /mnt/share/r50063443/LongLive/checkpoints/longlive2_5b/longlive2_merged_generator.pt
  lora_ckpt: null

algorithm:
  trainer: score_distillation
  distribution_loss: dmd
  all_causal: true
  generator_is_causal: true
  i2v: false
  backward_simulation: true
  teacher_forcing: false
  independent_first_frame: false
  denoising_loss_type: flow
  num_train_timestep: 1000
  real_guidance_scale: 3.0
  fake_guidance_scale: 0.0

training:
  # 主方案：attention 主干 LoRA 与 30 层 sla_linear 原始 weight/bias 联合训练。
  generator_train_scope: lora_plus_linear
  # 主干 LoRA 使用较小学习率；补偿层从零初始化，使用独立的较大学习率。
  lr: 2.0e-06
  lr_linear: 2.0e-05
  lr_critic: 4.0e-07
  weight_decay: 0.0
  beta1: 0.0
  beta2: 0.999
  beta1_critic: 0.0
  beta2_critic: 0.999
  batch_size: 1
  # 有效 batch = DP 数 x batch_size x gradient_accumulation_steps。
  gradient_accumulation_steps: 4
  max_grad_norm_generator: 10.0
  max_grad_norm_critic: 10.0
  ema_weight: 0.0
  # 每 20 次 optimizer update 保存一次，只保留最近 5 个完整 checkpoint。
  log_iters: 20
  max_checkpoints: 5
  # 正式微调执行 200 次 optimizer update；不要与上面的扩散时间步 1000 混淆。
  max_iters: 200
  gc_interval: 50
  # 线性补偿与 Critic 每个 optimizer step 都更新。
  dfake_gen_update_ratio: 1
  num_training_frames: 32
  slice_last_frames: 32

data:
  # UTF-8 文本每个非空行是一条提示词；shape 为 [B,T,C,H,W]。
  data_path: data/train/vidprom_filtered_extended/prompts_train.txt
  eval_data_path: data/benchmarks/vbench_standard/5pct/prompts.txt
  image_or_video_shape: [1, 32, 48, 44, 80]

inference:
  # backward simulation 与训练内验证都采用 LongLive2.0 四步采样。
  sampling_steps: 4
  local_attn_size: 32
  sink_size: 0
  multi_shot_sink: false
  multi_shot_rope_offset: 8

evaluation:
  # 默认只保存 latent，避免训练期间 VAE 解码阻塞所有 rank。
  interval: 100
  num_frames: 32
  use_ema: false
  val_batch_size: 1
  save_latents_only: true

adapter:
  # Generator attention 主干与 Fake Critic 都使用 LoRA；sla_linear 不包装 LoRA。
  type: lora
  rank: 128
  alpha: 128
  dropout: 0.0
  apply_to_critic: true
  verbose: true

# 昇腾 BF16 训练不启用 NVFP4 或其他量化。
model_quant: false

logging:
  seed: 42
  wandb_key: null
  wandb_entity: null
  wandb_project: LongLive2-HSA-SLA-CAG-NPU
