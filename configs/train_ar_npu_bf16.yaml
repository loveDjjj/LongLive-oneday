# Ascend NPU BF16 AR teacher-forcing training template.
# Launch with:
#   LLV2_DEVICE=npu torchrun --standalone --nproc_per_node=8 train.py \
#     --config_path configs/train_ar_npu_bf16.yaml \
#     --logdir logs/train_ar_npu_bf16 --wandb-save-dir wandb --disable-wandb

infra:
  sequence_parallel_size: 4
  sharding_strategy: hybrid_full
  mixed_precision: true
  gradient_checkpointing: true
  vae_halo_latents: 28
  generator_fsdp_wrap_strategy: size
  text_encoder_fsdp_wrap_strategy: size

model_kwargs:
  model_name: Wan2.2-TI2V-5B
  timestep_shift: 5.0
  num_frame_per_block: 8
  local_attn_size: -1

algorithm:
  trainer: diffusion
  causal: true
  teacher_forcing: true
  num_train_timestep: 1000
  denoising_loss_type: flow

training:
  lr: 1.0e-05
  weight_decay: 0.0
  beta1: 0.0
  beta2: 0.999
  batch_size: 1
  gradient_accumulation_steps: 1
  ema_weight: 0.99
  ema_start_step: 100
  log_iters: 1
  max_checkpoints: 20
  max_iters: 600
  gc_interval: 100
  error_recycling:
    enabled: true
    num_buckets: 50
    buffer_size_per_bucket: 500
    buffer_warmup_iter: 50
    context_inject_prob: 0.9
    latent_inject_prob: 0.9
    noise_inject_prob: 0.01
    clean_prob: 0.2
    clean_buffer_update_prob: 0.1
    modulate_factor: 0.3
    start_step: 0
    replacement_strategy: random

data:
  data_path: /path/to/longlive2/train_dataset
  eval_data_path: /path/to/longlive2/eval_prompts
  image_or_video_shape:
  - 1
  - 96
  - 48
  - 44
  - 80
  load_raw_video: true

inference:
  sampling_steps: 50
  sink_size: 0
  multi_shot_sink: true
  multi_shot_rope_offset: 8
  guidance_scale: 3.0
  kv_quant: false
  streaming_vae: false
  async_vae: false

evaluation:
  interval: 1
  num_frames: 16
  use_ema: true
  val_batch_size: 1
  save_latents_only: true

model_quant: false
torch_compile: false

logging:
  seed: 0
  wandb_key: null
  wandb_entity: null
  wandb_project: LongLive2-AR-NPU-BF16
