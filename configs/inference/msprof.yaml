# 昇腾 msprof 推理预设。性能结果只能在相同 profiler 参数下横向比较。
# 模型路径可通过 LONGLIVE_MODEL_ROOT 和 LONGLIVE_GENERATOR_CKPT 环境变量覆盖。
model:
  name: Wan2.2-TI2V-5B
  root: /mnt/a800_share/r50063443/Wan2.2-TI2V-5B
  generator_checkpoint: /mnt/a800_share/r50063443/LongLive/checkpoints/longlive2_5b/longlive2_merged_generator.pt
  timestep_shift: 5.0
  num_frame_per_block: 8
  local_attn_size: 32

# SP 组共同生成一个样本；专用异步 VAE 模式要求额外暴露一张 NPU。
runtime:
  sp_size: 4
  dp_size: 1
  model_num_heads: 24
  vae_mode: async_dedicated

# 生成参数描述 latent 形状和因果采样策略。
generation:
  latent_channels: 48
  latent_height: 44
  latent_width: 80
  sampling_steps: 4
  sink_size: 8
  guidance_scale: 1.0
  multi_shot_sink: true
  multi_shot_rope_offset: 8

# 预热样本计入运行但不应计入最终统计。
measurement:
  prompts: data/benchmarks/performance/prompts.txt
  num_prompts: 2
  warmup_per_rank: 1
  seed: 0

# latent 帧数分别对应约 5、16、32 和 64 秒的像素视频。
presets:
  5s:
    latent_frames: 32
  16s:
    latent_frames: 96
  32s:
    latent_frames: 192
  64s:
    latent_frames: 384

# profiler 参数由启动脚本原样传给 msprof。
msprof:
  output_type: db
  storage_limit: 50000MB
  task_time: "on"
  # 正式性能分析默认启用 AICore PMU，用于采集 PipeUtilization。
  # MSPROF_AI_CORE=false 仅用于定位 PMU/FFTS 环境问题，不能替代完整性能分析。
  ai_core: true
  aic_mode: task-based
  aic_metrics: PipeUtilization
  recover_parse: auto

# 默认运行稠密对照；可选择 hsa_cag、sla_cag 或 hsa_sla_cag。
sparsity:
  enabled: false
  method: dense
  profiles:
    hsa_cag:
      backend: mindiesd
      # 三种方法使用相同 CAG 目标/基准，避免预算差异污染路由对比。
      sparsity: 0.85
      sparsity_base: 0.95
      block_q: 128
      block_k: 128
      # 第一层只选择 history；current8 与 LongLive sink frame 始终进入候选池。
      protect_current_frames: true
      protect_longlive_sink_frames: true
      keep_near_history_frames: 4
      keep_dynamic_history_frames: 4
      # current frame 内部 blocks 仍参加最终全局 CAG Top-K。
      dense_current_blocks: false
      # HSA 历史 KV 来源：rolling 使用 LongLive 32 帧 resident KV；full 保留全部已完成历史帧供论文式 frame retrieval。
      hsa_history_mode: rolling
      first_chunk_dense: true
      budget_reference: full_resident_kv
      query_block_batch: 1
    hsa_sla_cag:
      backend: mindiesd
      sparsity: 0.85
      sparsity_base: 0.95
      block_q: 128
      block_k: 128
      feature_map: softmax
      protect_current_frames: true
      protect_longlive_sink_frames: true
      keep_near_history_frames: 4
      keep_dynamic_history_frames: 4
      dense_current_blocks: false
      # HSA+SLA 只让 global sink / shot sink 各前 2 帧进入候选池。
      max_global_sink_frames: 2
      max_shot_sink_frames: 2
      first_chunk_dense: true
      budget_reference: full_resident_kv
      # 完整 KV 线性补偿与稀疏 softmax 分支并行存在。
      full_kv_linear_compensation: true
      query_block_batch: 1
      linear_cache: true
      linear_eps: 1.0e-5
    sla_cag:
      backend: mindiesd
      # 与 HSA/混合方法保持相同 CAG 预算，用于公平比较 block selector。
      sparsity: 0.85
      sparsity_base: 0.95
      block_q: 128
      block_k: 128
      feature_map: softmax
      hard_keep_sink_frames: 1
      hard_keep_recent_frames: 1
      dense_current_blocks: false
      first_chunk_dense: true
      budget_reference: full_resident_kv
      # 完整 KV 线性补偿与稀疏 softmax 分支并行存在。
      full_kv_linear_compensation: true
      query_block_batch: 1
      linear_cache: true
      linear_eps: 1.0e-5
