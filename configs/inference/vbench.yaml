# 昇腾 VBench 标准评测预设。VBench-Long 的评测器尚未完成昇腾适配，因此不在当前维护范围内。
# 模型路径可通过 LONGLIVE_MODEL_ROOT 和 LONGLIVE_GENERATOR_CKPT 环境变量覆盖。
models:
  longlive2:
    entrypoint: inference_sp.py
    model_name: Wan2.2-TI2V-5B
    model_root: /mnt/share/weight/Wan2.2-TI2V-5B
    generator_checkpoint: /mnt/share/weight/LongLive/checkpoints/longlive2_5b/longlive2_merged_generator.pt
    timestep_shift: 5.0
    num_frame_per_block: 8
    local_attn_size: 32
    sampling_steps: 4
    guidance_scale: 1.0
    sink_size: 8
    multi_shot_sink: true
    multi_shot_rope_offset: 8
  wan22:
    entrypoint: inference_wan22_sp.py
    model_name: Wan2.2-TI2V-5B
    model_root: /mnt/share/weight/Wan2.2-TI2V-5B
    timestep_shift: 5.0
    sampling_steps: 50
    sample_solver: unipc
    guidance_scale: 5.0
    width: 1280
    height: 704

# 每个数据集同时声明生成提示词、命名提示词和 VBench 元数据，解析时会校验数量一致。
datasets:
  standard:
    full:
      generation_prompts: data/benchmarks/vbench_standard/full/prompts.txt
      naming_prompts: data/benchmarks/vbench_standard/full/prompts.txt
      full_info: data/benchmarks/vbench_standard/full/full_info.json
    5pct:
      generation_prompts: data/benchmarks/vbench_standard/5pct/prompts.txt
      naming_prompts: data/benchmarks/vbench_standard/5pct/prompts.txt
      full_info: data/benchmarks/vbench_standard/5pct/full_info.json
    20pct:
      generation_prompts: data/benchmarks/vbench_standard/20pct/prompts.txt
      naming_prompts: data/benchmarks/vbench_standard/20pct/prompts.txt
      full_info: data/benchmarks/vbench_standard/20pct/full_info.json
  augmented:
    full:
      generation_prompts: data/benchmarks/vbench_augmented/full/prompts.txt
      naming_prompts: data/benchmarks/vbench_standard/full/prompts.txt
      full_info: data/benchmarks/vbench_standard/full/full_info.json
    5pct:
      generation_prompts: data/benchmarks/vbench_augmented/5pct/prompts.txt
      naming_prompts: data/benchmarks/vbench_standard/5pct/prompts.txt
      full_info: data/benchmarks/vbench_standard/5pct/full_info.json
    20pct:
      generation_prompts: data/benchmarks/vbench_augmented/20pct/prompts.txt
      naming_prompts: data/benchmarks/vbench_standard/20pct/prompts.txt
      full_info: data/benchmarks/vbench_standard/20pct/full_info.json

# 预设未覆盖时使用以下并行规模、帧率和随机种子。
defaults:
  pixel_frames: 125
  fps: 24
  sp_size: 2
  dp_size: 8
  seeds: [0, 1, 2, 3, 4]

# 命令行只接受这里列出的预设名称。
presets:
  longlive2_standard_full: {engine: longlive2, category: standard, subset: full}
  longlive2_standard_5pct: {engine: longlive2, category: standard, subset: 5pct}
  longlive2_standard_20pct: {engine: longlive2, category: standard, subset: 20pct}
  longlive2_augmented_full: {engine: longlive2, category: augmented, subset: full}
  longlive2_augmented_5pct: {engine: longlive2, category: augmented, subset: 5pct}
  longlive2_augmented_20pct: {engine: longlive2, category: augmented, subset: 20pct}
  wan22_standard_full: {engine: wan22, category: standard, subset: full}
  wan22_standard_5pct: {engine: wan22, category: standard, subset: 5pct}
  wan22_standard_20pct: {engine: wan22, category: standard, subset: 20pct}
  wan22_augmented_full: {engine: wan22, category: augmented, subset: full}
  wan22_augmented_5pct: {engine: wan22, category: augmented, subset: 5pct}
  wan22_augmented_20pct: {engine: wan22, category: augmented, subset: 20pct}

# 默认运行稠密对照；设置 LONGLIVE_SPARSE_METHOD=hsa_cag 可启用同一检查点的稀疏评测。
sparsity:
  enabled: false
  method: dense
  options:
    # 推理使用 MindIE-SD 融合 RainFusionAttention；不可用时直接失败。
    backend: mindiesd
    sparsity: 0.85
    sparsity_base: 0.95
    block_q: 128
    block_k: 128
    keep_frames: 6
    keep_sink: 1
    keep_near: 2
    dense_current: true
    min_sparse_history_frames: 2
    query_block_batch: 1
