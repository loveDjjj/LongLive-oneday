# Light-Forcing-style HSA+CAG post-training for LongLive-2.0-5B on Ascend.
# The generator uses sparse rollout attention. Dense real/fake score networks
# provide the DMD supervision. This is prompt-only and does not load videos.

infra:
  sequence_parallel_size: 4
  sharding_strategy: hybrid_full
  mixed_precision: true
  gradient_checkpointing: true
  generator_fsdp_wrap_strategy: size
  real_score_fsdp_wrap_strategy: size
  fake_score_fsdp_wrap_strategy: size
  text_encoder_fsdp_wrap_strategy: size

model_kwargs:
  model_name: Wan2.2-TI2V-5B
  model_root: /mnt/share/weight/Wan2.2-TI2V-5B
  timestep_shift: 5.0
  num_frame_per_block: 8
  local_attn_size: 32
  sparse_config: &hsa_config
    enabled: true
    sparsity: 0.85
    sparsity_base: 0.95
    block_q: 40
    block_k: 40
    keep_frames: 6
    keep_sink: 1
    keep_near: 2
    dense_current: true
    min_sparse_history_frames: 2
    # Keep the portable NPU backend memory-bounded during backward recompute.
    query_block_batch: 1
    num_output_frames: 32
    num_frame_per_block: 8
    local_attn_size: 32

# DMD real-score teacher remains dense.
real_model_kwargs:
  model_name: Wan2.2-TI2V-5B
  model_root: /mnt/share/weight/Wan2.2-TI2V-5B
  timestep_shift: 5.0
  num_frame_per_block: 8
  local_attn_size: 32

# The dense critic estimates the sparse student's generated distribution.
fake_model_kwargs:
  model_name: Wan2.2-TI2V-5B
  model_root: /mnt/share/weight/Wan2.2-TI2V-5B
  timestep_shift: 5.0
  num_frame_per_block: 8
  local_attn_size: 32

checkpoints:
  generator_ckpt: /mnt/share/weight/LongLive/checkpoints/longlive2_5b/longlive2_merged_generator.pt
  real_score_ckpt: null
  fake_score_ckpt: null

algorithm:
  trainer: score_distillation
  distribution_loss: dmd
  all_causal: true
  ts_schedule: false
  real_guidance_scale: 3.0
  fake_guidance_scale: 0.0

training:
  lr: 2.0e-06
  lr_critic: 4.0e-07
  weight_decay: 0.0
  beta1: 0.0
  beta2: 0.999
  beta1_critic: 0.0
  beta2_critic: 0.999
  batch_size: 1
  # SP4 x DP4 with 16 accumulation gives effective global batch 64.
  gradient_accumulation_steps: 16
  ema_weight: 0.99
  ema_start_step: 200
  log_iters: 10
  max_checkpoints: 20
  max_iters: 2000
  gc_interval: 50
  dfake_gen_update_ratio: 5
  min_num_training_frames: 32
  num_training_frames: 32
  slice_last_frames: 32

data:
  data_path: data/train/vidprom_filtered_extended/prompts_train.txt
  eval_data_path: data/benchmarks/vbench_standard/5pct/prompts.txt
  image_or_video_shape:
  - 1
  - 32
  - 48
  - 44
  - 80

inference:
  sampling_steps: 4
  local_attn_size: 32
  sink_size: 0
  multi_shot_rope_offset: 8

evaluation:
  interval: 100
  num_frames: 32
  use_ema: false
  val_batch_size: 1
  save_latents_only: true

adapter:
  type: lora
  rank: 128
  alpha: 128
  dropout: 0.0
  apply_to_critic: true
  verbose: true

model_quant: false
torch_compile: false

logging:
  seed: 42
  wandb_key: null
  wandb_entity: null
  wandb_project: LongLive2-HSA-CAG-NPU
