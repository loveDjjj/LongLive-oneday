# LongLive-2.0 BF16 msprof run: 360 latent frames -> 1437 decoded frames
# -> 59.875 seconds at 24 FPS. This config generates only the first prompt.
model_kwargs:
  model_name: Wan2.2-TI2V-5B
  model_root: /mnt/share/weight/Wan2.2-TI2V-5B
  timestep_shift: 5.0
  num_frame_per_block: 8
  local_attn_size: 32

sp_size: 4
dp_size: 1
auto_sp_remainder: false
model_num_heads: 24

use_ema: false
output_folder: videos/benchmarks/msprof_longlive_60s_sp4_dp1
num_samples: 1
save_latents_only: false
save_with_index: true
# Zero means stop after local sample index 0, so SP4 generates one video total.
inference_iter: 0
num_output_frames: 360

data:
  data_path: data/benchmarks/performance/prompts.txt
  image_or_video_shape: [1, 360, 48, 44, 80]

inference:
  sampling_steps: 4
  sink_size: 8
  guidance_scale: 1.0
  multi_shot_sink: true
  multi_shot_rope_offset: 8
  kv_quant: false
  streaming_vae: false
  async_vae: false
  vae_type: wan
  vae_device: null

checkpoints:
  generator_ckpt: /mnt/share/weight/LongLive/checkpoints/longlive2_5b/longlive2_merged_generator.pt
  lora_ckpt: null

model_quant: false
torch_compile: false

logging:
  seed: 0
