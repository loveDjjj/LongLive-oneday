# VBench Standard 20% K-Means subset with public Wan2.1/Qwen2.5-3B seed-42 augmentation.
# 186 prompts, 12 NPU: SP2 x DP6, 32 latent frames -> 5.21 s at 24 FPS, 1280x704.
model_kwargs:
  model_name: Wan2.2-TI2V-5B
  model_root: /mnt/share/weight/Wan2.2-TI2V-5B
  timestep_shift: 5.0
  num_frame_per_block: 8
  local_attn_size: 32

sp_size: 2
dp_size: 6
auto_sp_remainder: false
model_num_heads: 24
use_ema: false
output_folder: videos/benchmarks/vbench_standard_20pct_augmented_5s
num_samples: 1
save_latents_only: false
save_with_index: true
inference_iter: -1
num_output_frames: 32

data:
  data_path: data/benchmarks/vbench_standard_20pct_augmented_wan21_qwen25_seed42/prompts.txt
  image_or_video_shape: [1, 32, 48, 44, 80]

inference:
  sampling_steps: 4
  sink_size: 8
  guidance_scale: 1.0
  multi_shot_sink: true
  multi_shot_rope_offset: 8
  kv_quant: false
  streaming_vae: false
  async_vae: false
  vae_type: wan
  vae_device: null

checkpoints:
  generator_ckpt: /mnt/share/weight/LongLive/checkpoints/longlive2_5b/longlive2_merged_generator.pt
  lora_ckpt: null

model_quant: false
torch_compile: false
logging:
  seed: 0
