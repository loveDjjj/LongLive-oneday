# VBench-Long protocol: 360 latent frames -> 1437 decoded frames -> 59.88 s at 24 FPS.
# Correct full Wan VAE decoding is used. Verify memory before running the full prompt set.
model_kwargs:
  model_name: Wan2.2-TI2V-5B
  model_root: /mnt/share/weight/Wan2.2-TI2V-5B
  timestep_shift: 5.0
  num_frame_per_block: 8
  local_attn_size: 32

sp_size: 8
dp_size: 1
auto_sp_remainder: false
model_num_heads: 24
use_ema: false
output_folder: videos/benchmarks/vbench_long_60s
num_samples: 1
save_latents_only: false
save_with_index: true
inference_iter: -1
num_output_frames: 360

data:
  data_path: data/benchmarks/vbench_long/prompts.txt
  image_or_video_shape: [1, 360, 48, 44, 80]

inference:
  sampling_steps: 4
  sink_size: 8
  guidance_scale: 1.0
  multi_shot_sink: true
  multi_shot_rope_offset: 8
  kv_quant: false
  streaming_vae: false
  async_vae: false
  vae_type: wan
  vae_device: null

checkpoints:
  generator_ckpt: /mnt/share/weight/LongLive/checkpoints/longlive2_5b/longlive2_merged_generator.pt
  lora_ckpt: null

model_quant: false
torch_compile: false
logging:
  seed: 0
