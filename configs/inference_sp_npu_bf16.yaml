# 昇腾 NPU BF16 Ulysses 序列并行推理配置。
# 推荐 8 卡启动：
#   LLV2_DEVICE=npu torchrun --standalone --nproc_per_node=8 inference_sp.py --config_path configs/inference_sp_npu_bf16.yaml

model_kwargs:
  model_name: Wan2.2-TI2V-5B
  model_root: /mnt/share/weight/Wan2.2-TI2V-5B
  timestep_shift: 5.0
  # sp_size=8 时，num_frame_per_block 需要能让 gcd(model_num_heads, num_frame_per_block) 被 8 整除。
  num_frame_per_block: 8
  local_attn_size: 32

sp_size: 8
dp_size: 1
auto_sp_remainder: false
model_num_heads: 24

use_ema: false
output_folder: videos/longlive2_npu_bf16_sp
num_samples: 1
save_latents_only: false
save_with_index: true
inference_iter: -1
num_output_frames: 128

data:
  data_path: example/long_example.txt
  image_or_video_shape:
  - 1
  - 128
  - 48
  - 44
  - 48

inference:
  sampling_steps: 4
  sink_size: 8
  guidance_scale: 1.0
  multi_shot_sink: true
  multi_shot_rope_offset: 8
  kv_quant: false
  streaming_vae: true
  async_vae: false
  vae_type: wan
  vae_device: null

checkpoints:
  generator_ckpt: /mnt/share/weight/LongLive/checkpoints/longlive2_5b/longlive2_merged_generator.pt
  lora_ckpt: null

model_quant: false
torch_compile: false

logging:
  seed: 0
